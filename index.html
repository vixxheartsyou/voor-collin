<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collin & Caprice · 4 jaar</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fredoka',system-ui,sans-serif;color:#6b4a5c;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#ffd6e5 0%,#fff0f6 45%,#d4ebff 100%);overflow:hidden}
.card{background:rgba(255,255,255,.82);border-radius:32px;padding:34px 26px;width:100%;max-width:400px;box-shadow:0 14px 44px rgba(255,143,181,.28);text-align:center;margin-top:60px;animation:pop .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.snowy{width:110px;margin:-92px auto 4px}.snowy svg{width:100%;height:auto;display:block}
.bounce{animation:bounce 2s ease-in-out infinite}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.no{animation:no .6s ease}@keyframes no{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
.yay{animation:dance .5s ease-in-out 3}@keyframes dance{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(-12deg) translateY(-10px)}75%{transform:rotate(12deg) translateY(-10px)}}
.wiggle{animation:wiggle .45s ease-in-out}@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.cheek{display:none}
h1{font-size:28px;font-weight:700;margin-bottom:4px}.sub{color:#9a7d8c;margin-bottom:22px}
input{width:100%;font:inherit;font-size:16px;color:#6b4a5c;padding:14px 18px;border-radius:16px;border:2px solid #ffb8d1;background:#fff;margin-bottom:12px;outline:none}
input:focus{border-color:#7fbfff}
button{width:100%;font:inherit;font-weight:600;font-size:18px;cursor:pointer;border:none;padding:15px 30px;border-radius:999px;color:#fff;background:linear-gradient(135deg,#ff8fb5,#ffa6c6);box-shadow:0 6px 0 #e9739d}
button:disabled{opacity:.7}
.msg{min-height:24px;margin-top:12px;font-weight:500;color:#ff8fb5}
.h{position:fixed;bottom:-40px;opacity:.55;animation:rise linear forwards;pointer-events:none}@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
</style></head><body>
<form class="card" id="f" autocomplete="off">
  <div class="snowy bounce" id="sn">
<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="100" cy="160" rx="66" ry="8" fill="rgba(107,74,92,.12)"/>
  <circle cx="58" cy="46" r="18" fill="#958676"/><circle cx="58" cy="46" r="10" fill="#f8bfd0"/>
  <circle cx="142" cy="46" r="18" fill="#958676"/><circle cx="142" cy="46" r="10" fill="#f8bfd0"/>
  <ellipse cx="100" cy="100" rx="80" ry="62" fill="#a99b8d"/>
  <path d="M100 40 Q97 62 100 84" stroke="#6b5f55" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="100" cy="122" rx="64" ry="42" fill="#f6efe7"/>
  <ellipse class="cheek" cx="52" cy="118" rx="30" ry="26" fill="#f6efe7" stroke="#e8ddd2" stroke-width="2"/>
  <ellipse class="cheek" cx="148" cy="118" rx="30" ry="26" fill="#f6efe7" stroke="#e8ddd2" stroke-width="2"/>
  <g class="eyes">
    <circle cx="72" cy="94" r="11" fill="#2b2024"/><circle cx="128" cy="94" r="11" fill="#2b2024"/>
  </g>
  <circle cx="76" cy="90" r="4" fill="#fff"/><circle cx="132" cy="90" r="4" fill="#fff"/>
  <ellipse cx="58" cy="114" rx="11" ry="6" fill="#ffb3c8" opacity=".85"/>
  <ellipse cx="142" cy="114" rx="11" ry="6" fill="#ffb3c8" opacity=".85"/>
  <ellipse cx="100" cy="108" rx="6" ry="4.5" fill="#f28fae"/>
  <path d="M92 116 Q100 123 100 113 Q100 123 108 116" stroke="#8a6a72" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <g stroke="#b9aca0" stroke-width="1.6" stroke-linecap="round">
    <line x1="80" y1="110" x2="54" y2="104"/><line x1="80" y1="114" x2="54" y2="116"/>
    <line x1="120" y1="110" x2="146" y2="104"/><line x1="120" y1="114" x2="146" y2="116"/>
  </g>
  <ellipse cx="84" cy="156" rx="11" ry="6" fill="#f8bfd0"/><ellipse cx="116" cy="156" rx="11" ry="6" fill="#f8bfd0"/>
</svg></div>
  <h1>Hey jij!</h1>
  <p class="sub">Snowy bewaakt deze plek.<br>Maar één persoon mag naar binnen...</p>
  <input id="u" placeholder="username" autocapitalize="none" autocorrect="off" spellcheck="false">
  <input id="p" type="password" placeholder="password">
  <button id="b" type="submit">Laat me binnen 💕</button>
  <p class="msg" id="m"></p>
</form>
<script>
(function(){
  const ITER=150000;
  const lines=["Snowy herkent je niet 🤨","Nope! Probeer opnieuw, schatje","Hint: hoe lang zijn we samen? 😏"];let wrong=0;
  const hearts=['💗','💕','🩵','✨','💖','🤍'];
  setInterval(()=>{const s=document.createElement('span');s.className='h';s.textContent=hearts[Math.floor(Math.random()*6)];s.style.left=Math.random()*100+'vw';s.style.fontSize=(14+Math.random()*22)+'px';s.style.animationDuration=(7+Math.random()*7)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),15000);},700);
  const dataP=fetch('love.bin',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();});
  const f=document.getElementById('f'),sn=document.getElementById('sn'),m=document.getElementById('m'),b=document.getElementById('b');
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const u=document.getElementById('u').value.trim().toLowerCase(),p=document.getElementById('p').value.trim().toLowerCase();
    b.disabled=true;b.textContent='Even kijken… 🐹';
    try{
      const buf=new Uint8Array(await dataP);
      const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(u+':'+p),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
      m.textContent='Welkom thuis 💕';sn.className='snowy yay';
      const html=new TextDecoder().decode(plain);
      try{sessionStorage.setItem('cc_unlocked','1');}catch(e){}
      setTimeout(()=>{document.open();document.write(html);document.close();},1400);
    }catch(err){
      b.disabled=false;b.textContent='Laat me binnen 💕';
      sn.className='snowy';void sn.offsetWidth;sn.className='snowy no';setTimeout(()=>sn.className='snowy bounce',650);
      m.textContent=lines[Math.min(wrong++,lines.length-1)];
      f.classList.remove('wiggle');void f.offsetWidth;f.classList.add('wiggle');
    }
  });
})();
</script></body></html>
